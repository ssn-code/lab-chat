<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lab Chat</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="app"><header><div><p class="eyebrow">COLLEGE COMPUTER LAB</p><h1>LAB CHAT</h1></div><div class="online">● <strong id="user-count">0</strong> users online</div></header><section id="messages" class="messages" aria-live="polite"></section><form id="message-form" class="composer"><input id="message" maxlength="500" autocomplete="off" placeholder="Type a message..." disabled><button id="send" disabled>SEND</button></form><p id="status" class="status"></p></main>
<dialog id="name-dialog"><form id="join-form"><p class="eyebrow">WELCOME TO</p><h2>LAB CHAT</h2><p>Choose a name to join this lab session.</p><label for="username">Your name</label><input id="username" maxlength="20" autocomplete="nickname" required autofocus placeholder="e.g. SSN"><p id="join-error" class="error"></p><button>JOIN CHAT</button></form></dialog><script src="/app.js"></script></body></html>
